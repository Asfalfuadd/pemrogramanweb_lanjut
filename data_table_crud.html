<!DOCTYPE html>
<html>
<head>

<title>Data Mahasiswa</title>

<link rel="stylesheet" href="sr/jquery.dataTables.min.css">
<script src="sr/jquery-3.7.0.min.js"></script>
<script src="sr/jquery.dataTables.min.js"></script>

</head>
<body>

<h2>Tabel Data Mahasiswa</h2>

<!-- FORM INPUT -->
<input type="hidden" id="editIndex">
<input type="text" id="nama" placeholder="Nama">
<input type="text" id="nim" placeholder="NIM">
<input type="text" id="prodi" placeholder="Prodi">
<button onclick="simpanData()">Simpan</button>

<br><br>

<table border="1" id="table1">
    <thead>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Prodi</th>
            <th>Aksi</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>

<script>
let dataMahasiswa = [];

let table;

$(document).ready(function() {
    table = $('#table1').DataTable();
    renderTable();
});

function renderTable() {
    table.clear();

    dataMahasiswa.forEach((mhs, index) => {
        table.row.add([
            index + 1,
            mhs.nama,
            mhs.nim,
            mhs.prodi,
            `
            <button onclick="editData(${index})">Edit</button>
            <button onclick="hapusData(${index})">Hapus</button>
            `
        ]);
    });

    table.draw();
}

function simpanData() {
    let nama = $('#nama').val();
    let nim = $('#nim').val();
    let prodi = $('#prodi').val();
    let index = $('#editIndex').val();

    if (nama === '' || nim === '' || prodi === '') {
        alert("Semua field wajib diisi!");
        return;
    }

    if (index === '') {
        // CREATE
        dataMahasiswa.push({nama, nim, prodi});
    } else {
        // UPDATE
        dataMahasiswa[index] = {nama, nim, prodi};
        $('#editIndex').val('');
    }

    resetForm();
    renderTable();
}

function editData(index) {
    let mhs = dataMahasiswa[index];

    $('#nama').val(mhs.nama);
    $('#nim').val(mhs.nim);
    $('#prodi').val(mhs.prodi);

    $('#editIndex').val(index);
}

function hapusData(index) {
    if (confirm("Yakin hapus data?")) {
        dataMahasiswa.splice(index, 1);
        renderTable();
    }
}

function resetForm() {
    $('#nama').val('');
    $('#nim').val('');
    $('#prodi').val('');
}
</script>

</body>
</html>
